name: keepalive

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || echo "no change"
          git push
